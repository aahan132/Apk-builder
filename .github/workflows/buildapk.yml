name: Build Lightweight Native APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Android App Name'
        required: true
        default: 'AgriSeva Tractor'
      web_url:
        description: 'URL to wrap into APK'
        required: true
        default: 'https://gmtractor.tiiny.site'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Lightweight Android Project
        run: |
          mkdir -p app/src/main/java/com/agriseva/ledger
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          rootProject.name = "AgriSevaApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.agriseva.ledger'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.agriseva.ledger'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.agriseva.ledger">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="${{ github.event.inputs.app_name }}"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.AppCompat.Light.NoActionBar" parent="Theme.MaterialComponents.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/agriseva/ledger/MainActivity.java
          package com.agriseva.ledger;
          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("${{ github.event.inputs.web_url }}");
              }
          }
          EOF

      - name: Build Clean Lightweight APK
        run: gradle assembleDebug

      - name: Upload Clean APK (~1.5 MB)
        uses: actions/upload-artifact@v4
        with:
          name: AgriSeva-Tractor-Clean-1.8MB.apk
          path: app/build/outputs/apk/debug/app-debug.apk
